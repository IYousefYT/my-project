<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الخدمات - Mulanui Services</title>
    <link rel="stylesheet" href="../../css/dashboard/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../../js/dashboard/manage-services.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar">
    <div class="logo" onclick="window.location.href='../../index.html'">Mulanui <span>Services</span></div>
    
    <!-- زر القائمة الجانبية للموبايل -->
    <button class="mobile-menu-btn" id="menu-toggle-btn">
        <span></span>
        <span></span>
        <span></span>
    </button>
</header>

    <!-- القائمة الجانبية (Sidebar) -->
    <aside class="sidebar" style="position: fixed; right: 0; top: 70px; width: 250px; background: var(--bg-card); height: calc(100vh - 70px); border-left: 1px solid var(--border-color); padding: 20px; overflow-y: auto;">
        <ul class="sidebar-menu" id="sidebar-menu-items" style="list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px;">
            <!-- تتعبى تلقائياً بالجافا سكريبت -->
        </ul>
    </aside>

    <!-- المحتوى الرئيسي -->
    <div class="dashboard-container" style="margin-right: 270px; padding: 20px;">
        <div class="welcome-box">
            <div>
                <h2 style="font-size: 22px; margin-bottom: 5px;">إدارة خدمات الألعاب والبطاقات</h2>
                <p style="color: var(--text-muted); font-size: 14px;">إضافة وتعديل الأسعار والخدمات التابعة لكل لعبة أو منتج رقمي.</p>
            </div>
            <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
        </div>
        
        <!-- شريط البحث والفلترة وزر الإضافة -->
        <div style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;">
            <div style="display: flex; gap: 10px; flex-grow: 1; max-width: 600px;">
                <input type="text" id="search-service-input" placeholder="بحث عن خدمة أو سعر..." oninput="filterServices()" style="flex-grow: 1; background: #161b22; border: 1px solid #30363d; color: #fff; padding: 8px 12px; border-radius: 6px; font-family: 'Cairo', sans-serif;">
                <select id="game-filter" onchange="filterServices()" style="background: #161b22; border: 1px solid #30363d; color: #fff; padding: 8px 12px; border-radius: 6px; font-family: 'Cairo', sans-serif;">
                    <option value="all">جميع الألعاب / المنتجات</option>
                </select>
            </div>
            <button onclick="openAddServiceModal()" style="background: #238636; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-family: 'Cairo', sans-serif;">+ إضافة خدمة جديدة</button>
        </div>

        <div id="page-alert" class="page-alert"></div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID#</th>
                        <th>اسم الخدمة</th>
                        <th>اللعبة / المنتج المرتبط</th>
                        <th>السعر (بالدولار)</th>
                        <th>مقدم الخدمة (ID)</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="services-table-body">
                    <tr>
                        <td colspan="6" style="text-align: center; color: var(--text-muted);">جاري تحميل الخدمات...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- نافذة إضافة / تعديل خدمة -->
    <div id="addServiceModal" class="custom-modal-overlay" style="display: none;">
        <div class="custom-modal-content" style="background: #161b22; padding: 25px; border-radius: 12px; width: 450px; max-width: 90%; border: 1px solid #30363d; font-family: 'Cairo', sans-serif; color: #fff;">
            <h3 id="modal-title" style="margin-top: 0; margin-bottom: 20px; font-size: 18px; color: #58a6ff;">إضافة خدمة جديدة</h3>
            
            <!-- اختيار اللعبة المرتبطة -->
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-size: 13px; color: #8b949e;">العبة أو المنتج التابع له الخدمة</label>
                <select id="new-service-game-id" style="width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; font-family: 'Cairo', sans-serif;">
                    <!-- تعبئة الألعاب تلقائياً -->
                </select>
            </div>

            <!-- عنوان الخدمة -->
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-size: 13px; color: #8b949e;">عنوان الخدمة (مثلاً: شحن 1000 شدة)</label>
                <input type="text" id="new-service-title" placeholder="أدخل اسم الخدمة..." style="width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; font-family: 'Cairo', sans-serif;">
            </div>

            <!-- السعر -->
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-size: 13px; color: #8b949e;">السعر (بالدولار)</label>
                <input type="number" step="0.01" id="new-service-price" placeholder="0.00" style="width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; font-family: 'Cairo', sans-serif;">
            </div>

            <!-- الوصف التفصيلي (اختياري) -->
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-size: 13px; color: #8b949e;">الوصف التفصيلي (اختياري)</label>
                <textarea id="new-service-description" placeholder="تفاصيل إضافية عن الخدمة..." style="width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; font-family: 'Cairo', sans-serif; resize: vertical; min-height: 80px;"></textarea>
            </div>

            <!-- رابط أو رفع صورة الخدمة -->
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-size: 13px; color: #8b949e;">صورة الخدمة (رابط أو رفع ملف)</label>
                <input type="file" id="new-service-image-file" accept="image/*" style="width: 100%; padding: 8px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; font-family: 'Cairo', sans-serif; margin-bottom: 8px;">
                <input type="text" id="new-service-image-url" placeholder="أو أدخل رابط الصورة مباشرة (https://...)" style="width: 100%; padding: 8px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; font-size: 12px; font-family: 'Cairo', sans-serif;">
            </div>
            
            <!-- أزرار الحفظ والإغلاق -->
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" onclick="closeAddServiceModal()" style="background: #30363d; color: #c9d1d9; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: 'Cairo', sans-serif;">إلغاء</button>
                <button type="button" onclick="submitNewService()" style="background: #238636; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: 600;">حفظ</button>
            </div>
        </div>
    </div>
</body>
</html>
