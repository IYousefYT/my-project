<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الطلبات - Mulanui Services</title>
    <link rel="stylesheet" href="../../css/dashboard/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../../js/dashboard/manage-founder-orders.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        .custom-dropdown-container {
            position: relative;
            width: 100%;
        }
        .dropdown-search-box {
            width: 100%;
            background: #0f111a;
            border: 1px solid #232738;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .dropdown-search-box:focus {
            border-color: #7c3aed;
        }
        .dropdown-options-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 180px;
            overflow-y: auto;
            background: #161925;
            border: 1px solid #232738;
            border-radius: 6px;
            margin-top: 4px;
            z-index: 1000;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            display: none;
        }
        .dropdown-options-list::-webkit-scrollbar {
            width: 5px;
        }
        .dropdown-options-list::-webkit-scrollbar-track {
            background: #161925;
            border-radius: 6px;
        }
        .dropdown-options-list::-webkit-scrollbar-thumb {
            background: #7c3aed;
            border-radius: 6px;
        }
        .dropdown-option-item {
            padding: 10px 12px;
            color: #e5e7eb;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 1px solid rgba(35, 39, 56, 0.5);
            transition: background 0.15s;
        }
        .dropdown-option-item:hover {
            background: #232738;
            color: #fff;
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="logo" onclick="window.location.href='../../index.html'">Mulanui <span>Services</span></div>
    <button class="mobile-menu-btn" id="menu-toggle-btn">
        <span></span>
        <span></span>
        <span></span>
    </button>
</header>

    <aside class="sidebar" style="position: fixed; right: 0; top: 70px; width: 250px; background: var(--bg-card); height: calc(100vh - 70px); border-left: 1px solid var(--border-color); padding: 20px; overflow-y: auto;">
        <ul class="sidebar-menu" id="sidebar-menu-items" style="list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px;">
        </ul>
    </aside>

    <div class="dashboard-container" style="margin-right: 270px; padding: 20px;">
        <div class="welcome-box">
            <div>
                <h2 style="font-size: 22px; margin-bottom: 5px;">إدارة الطلبات</h2>
                <p style="color: var(--text-muted); font-size: 14px;">متابعة طلبات العملاء وتحديث حالتها لحظياً من قاعدة البيانات.</p>
            </div>
            <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
        </div>
        
        <div style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;">
            <div style="display: flex; gap: 10px; flex-grow: 1; max-width: 600px;">
                <input type="text" id="search-order-input" placeholder="بحث برقم الطلب أو ID المستخدم..." oninput="filterOrders()" style="flex-grow: 1; background: #161b22; border: 1px solid #30363d; color: #fff; padding: 8px 12px; border-radius: 6px; font-family: 'Cairo', sans-serif;">
                <select id="status-filter" onchange="filterOrders()" style="background: #161b22; border: 1px solid #30363d; color: #fff; padding: 8px 12px; border-radius: 6px; font-family: 'Cairo', sans-serif;">
                    <option value="all">جميع الحالات</option>
                    <option value="pending">معلق (Pending)</option>
                    <option value="approved">تم القبول (Approved)</option>
                    <option value="in_progress">قيد التنفيذ (In Progress)</option>
                    <option value="completed">مكتمل (Completed)</option>
                    <option value="cancelled">ملغي (Cancelled)</option>
                </select>
            </div>
            <button onclick="openAddOrderModal()" style="background: #238636; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-family: 'Cairo', sans-serif;">+ إضافة طلب جديد</button>
        </div>

        <div id="page-alert" class="page-alert"></div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>رقم الطلب</th>
                        <th>معرف العميل</th>
                        <th>معرف الخدمة</th>
                        <th>الحالة الحالية</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="orders-table-body">
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--text-muted);">جاري تحميل الطلبات...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- نافذة إضافة طلب جديد -->
    <div id="addOrderModal" class="custom-modal-overlay" style="display: none;">
        <div style="background: #161925; padding: 25px; border-radius: 12px; border: 1px solid #232738; width: 480px; max-width: 90%; font-family: 'Cairo', sans-serif; max-height: 90vh; overflow-y: auto;">
            <h3 id="order-modal-title" style="color: #fff; margin-bottom: 20px; font-size: 18px; border-bottom: 1px solid #232738; padding-bottom: 10px;">إضافة طلب جديد يدوياً</h3>
            
            <!-- العميل -->
            <div style="margin-bottom: 15px;">
                <label style="color: #a0aec0; display: block; margin-bottom: 5px; font-size: 13px;">اختر العميل (الابحث بالـ ID، Username، أو Nickname)</label>
                <div class="custom-dropdown-container">
                    <input type="text" id="client-search-input" class="dropdown-search-box" placeholder="ابحث هنا..." autocomplete="off">
                    <input type="hidden" id="new-client-id">
                    <div class="dropdown-options-list" id="client-options-list"></div>
                </div>
            </div>

            <!-- مقدم الخدمة -->
            <div style="margin-bottom: 15px;">
                <label style="color: #a0aec0; display: block; margin-bottom: 5px; font-size: 13px;">اختر مقدم الخدمة / البوستر (اختياري)</label>
                <div class="custom-dropdown-container">
                    <input type="text" id="provider-search-input" class="dropdown-search-box" placeholder="ابحث بالـ ID، Username، أو Nickname..." autocomplete="off">
                    <input type="hidden" id="new-provider-id">
                    <div class="dropdown-options-list" id="provider-options-list"></div>
                </div>
            </div>

            <!-- اللعبة -->
            <div style="margin-bottom: 15px;">
                <label style="color: #a0aec0; display: block; margin-bottom: 5px; font-size: 13px;">اختر اللعبة أو المنتج</label>
                <div class="custom-dropdown-container">
                    <input type="text" id="game-search-input" class="dropdown-search-box" placeholder="ابحث باسم اللعبة أو الـ ID..." autocomplete="off">
                    <input type="hidden" id="new-game-id">
                    <div class="dropdown-options-list" id="game-options-list"></div>
                </div>
            </div>

            <!-- الخدمة -->
            <div style="margin-bottom: 15px;">
                <label style="color: #a0aec0; display: block; margin-bottom: 5px; font-size: 13px;">اختر الخدمة المطلوبة</label>
                <div class="custom-dropdown-container">
                    <input type="text" id="service-search-input" class="dropdown-search-box" placeholder="اختر اللعبة أولاً لعرض خدماتها..." autocomplete="off" disabled>
                    <input type="hidden" id="new-service-id">
                    <div class="dropdown-options-list" id="service-options-list"></div>
                </div>
            </div>

            <!-- الحالة الأولية -->
            <div style="margin-bottom: 20px;">
                <label style="color: #a0aec0; display: block; margin-bottom: 5px; font-size: 13px;">الحالة الأولية</label>
                <select id="new-order-status" style="width: 100%; background: #0f111a; border: 1px solid #232738; color: #fff; padding: 10px; border-radius: 6px; box-sizing: border-box; font-family: 'Cairo', sans-serif;">
                    <option value="pending">معلق (Pending)</option>
                    <option value="approved">تم القبول (Approved)</option>
                    <option value="in_progress">قيد التنفيذ (In Progress)</option>
                </select>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button onclick="closeAddOrderModal()" style="background: #232738; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-family: 'Cairo', sans-serif;">إلغاء</button>
                <button onclick="submitNewOrder()" style="background: #238636; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-family: 'Cairo', sans-serif;">حفظ وإنشاء</button>
            </div>
        </div>
    </div>

</body>
</html>
