<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الألعاب والخدمات - Mulanui Services</title>
    <link rel="stylesheet" href="../../css/dashboard/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../../js/dashboard/manage-games.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar">
    <div class="logo" onclick="window.location.href='../../index.html'">Mulanui <span>Services</span></div>
    
    <!-- زر الثلاث شرايط (يظهر على الموبايل فقط) -->
    <button class="mobile-menu-btn" id="menu-toggle-btn">
        <span></span>
        <span></span>
        <span></span>
    </button>
</header>

    <!-- القائمة الجانبية (Sidebar) -->
    <aside class="sidebar" style="position: fixed; right: 0; top: 70px; width: 250px; background: var(--bg-card); height: calc(100vh - 70px); border-left: 1px solid var(--border-color); padding: 20px; overflow-y: auto;">
        <ul class="sidebar-menu" id="sidebar-menu-items" style="list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px;">
            <!-- العناصر تتعبى تلقائياً بالجافا سكريبت -->
        </ul>
    </aside>

    <!-- المحتوى الرئيسي -->
    <div class="dashboard-container" style="margin-right: 270px; padding: 20px;">
        <div class="welcome-box">
            <div>
                <h2 style="font-size: 22px; margin-bottom: 5px;">إدارة الألعاب والمنتجات الرقمية</h2>
                <p style="color: var(--text-muted); font-size: 14px;">إضافة وتعديل الألعاب والبطاقات الرقمية المتاحة للعملاء.</p>
            </div>
            <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
        </div>
        
        <!-- زر إضافة لعبة/منتج جديد وحقل البحث والفلترة -->
        <div style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;">
            <div style="display: flex; gap: 10px; flex-grow: 1; max-width: 600px;">
                <input type="text" id="search-game-input" placeholder="بحث عن لعبة أو منتج..." oninput="filterGames()" style="flex-grow: 1; background: #161b22; border: 1px solid #30363d; color: #fff; padding: 8px 12px; border-radius: 6px; font-family: 'Cairo', sans-serif;">
                <select id="category-filter" onchange="filterGames()" style="background: #161b22; border: 1px solid #30363d; color: #fff; padding: 8px 12px; border-radius: 6px; font-family: 'Cairo', sans-serif;">
                    <option value="all">جميع التصنيفات</option>
                    <option value="games">ألعاب</option>
                    <option value="cards">بطاقات رقمية</option>
                </select>
            </div>
            <button onclick="openAddGameModal()" style="background: #238636; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-family: 'Cairo', sans-serif;">+ إضافة منتج / لعبة جديدة</button>
        </div>

        <div id="page-alert" class="page-alert"></div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID#</th>
                        <th>أيقونة / صورة</th>
                        <th>اسم المنتج / اللعبة</th>
                        <th>التصنيف</th>
                        <th>الحالة</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="games-table-body">
                    <tr>
                        <td colspan="6" style="text-align: center; color: var(--text-muted);">جاري تحميل المنتجات...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- نافذة إضافة / تعديل لعبة أو منتج -->
    <div id="addGameModal" class="custom-modal-overlay" style="display: none;">
        <div class="custom-modal-content" style="background: #161b22; padding: 25px; border-radius: 12px; width: 450px; max-width: 90%; border: 1px solid #30363d; font-family: 'Cairo', sans-serif; color: #fff;">
            <h3 id="modal-title" style="margin-top: 0; margin-bottom: 20px; font-size: 18px; color: #58a6ff;">إضافة لعبة أو منتج جديد</h3>
            
            <!-- اسم اللعبة / المنتج -->
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-size: 13px; color: #8b949e;">اسم اللعبة أو المنتج</label>
                <input type="text" id="new-game-name" placeholder="أدخل الاسم..." style="width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; font-family: 'Cairo', sans-serif;">
            </div>

            <!-- الوصف التفصيلي (اختياري) -->
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-size: 13px; color: #8b949e;">الوصف التفصيلي (اختياري)</label>
                <textarea id="new-game-description" placeholder="أدخل وصفاً تفصيلياً أو اتركه فارغاً..." style="width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; font-family: 'Cairo', sans-serif; resize: vertical; min-height: 80px;"></textarea>
            </div>

            <!-- التصنيف الأساسي -->
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-size: 13px; color: #8b949e;">التصنيف الأساسي</label>
                <select id="new-game-category" style="width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; font-family: 'Cairo', sans-serif;">
                    <option value="games">لعبة</option>
                    <option value="cards">بطاقة رقمية</option>
                </select>
            </div>

            <!-- رفع صورة الأيقونة -->
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-size: 13px; color: #8b949e;">أيقونة / صورة المنتج (الحد الأقصى 500 كيلوبايت)</label>
                <input type="file" id="new-game-image-file" accept="image/*" onchange="previewAndValidateImage(event)" style="width: 100%; color: #8b949e; font-size: 12px;">
                <input type="hidden" id="new-game-icon">
                
                <!-- معاينة الصورة مع إمكانية التكبير -->
                <div id="image-preview-container" style="display: none; margin-top: 10px; position: relative; text-align: center;">
                    <img id="img-preview" src="" alt="Preview" onclick="openImageZoom(this.src)" style="max-height: 80px; border-radius: 6px; border: 1px solid #30363d; cursor: pointer; transition: 0.2s;" title="انقر لتكبير الصورة">
                    <span style="display: block; font-size: 10px; color: #8b949e; margin-top: 2px;">انقر على الصورة لتكبيرها</span>
                    <button type="button" onclick="clearSelectedImage()" style="display: block; margin: 5px auto 0; background: #ef4444; color: #fff; border: none; padding: 2px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;">حذف الصورة</button>
                </div>
            </div>

            <!-- أزرار الحفظ والإغلاق -->
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" onclick="closeAddGameModal()" style="background: #30363d; color: #c9d1d9; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: 'Cairo', sans-serif;">إلغاء</button>
                <button type="button" onclick="submitNewGame()" style="background: #238636; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: 600;">حفظ</button>
            </div>
        </div>
    </div>

    <!-- نافذة عرض الصورة مكبرة (Zoom Modal) -->
    <div id="imageZoomModal" class="custom-modal-overlay" onclick="closeImageZoom()" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center; cursor: zoom-out;">
        <img id="zoomed-img" src="" style="max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 5px 25px rgba(0,0,0,0.5);">
    </div>
</body>
</html>
