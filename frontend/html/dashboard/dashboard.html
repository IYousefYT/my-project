<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mulanui Services - الملف الشخصي</title>
    <link rel="stylesheet" href="../../css/dashboard/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../../js/dashboard/dashboard.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar">
    <div class="logo" onclick="window.location.href='../../index.html'">Mulanui <span>Services</span></div>
    
    <!-- زر الثلاث شراط (يظهر على الموبايل فقط) -->
    <button class="mobile-menu-btn" id="menu-toggle-btn">
        <span></span>
        <span></span>
        <span></span>
    </button>
</header>
    <!-- القائمة الجانبية (Sidebar) -->
    <aside class="sidebar" style="position: fixed; right: 0; top: 70px; width: 250px; background: var(--bg-card); height: calc(100vh - 70px); border-left: 1px solid var(--border-color); padding: 20px;">
        <ul class="sidebar-menu" id="sidebar-menu-items" style="list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px;">
            <!-- العناصر هتتعبى تلقائياً هنا بالجافا سكريبت حسب الرول -->
        </ul>
    </aside>

    <!-- المحتوى الرئيسي -->
    <div class="dashboard-container" style="margin-right: 270px; padding: 20px;">
        <div class="welcome-box">
            <div>
                <h2 id="user-welcome" style="margin-bottom: 5px;">مرحباً بك</h2>
                <p id="user-role-text" style="color: var(--text-muted); font-size: 14px;"></p>
            </div>
            <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
        </div>

        <h2 style="font-size: 22px; margin-bottom: 20px;">الطلبات الحالية</h2>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>رقم الطلب</th>
                        <th>رقم الخدمة</th>
                        <th>الحالة</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="orders-table-body">
                    <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">جاري تحميل الطلبات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
