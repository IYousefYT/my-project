<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Mulanui Services</title>
    <link rel="stylesheet" href="../../css/auth/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- شريط التنقل العلوي -->
    <header class="navbar">
        <div class="logo" onclick="window.location.href='../../index.html'">Mulanui <span>Services</span></div>
        <nav>
            <a href="../../index.html">الرئيسية</a>
        </nav>
    </header>

    <!-- حاوية نموذج تسجيل الدخول -->
    <main class="auth-container">
        <div class="auth-card">
            <h2>تسجيل الدخول</h2>
            
            <!-- رسائل التنبيه (خطأ / نجاح) -->
            <div id="alert-box" class="alert"></div>

<form id="login-form">
                <div class="form-group">
                    <label for="login-email">البريد الإلكتروني</label>
                    <input type="email" id="login-email" required placeholder="name@example.com">
                </div>
                
                <div class="form-group">
                    <label for="login-password">كلمة المرور</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-submit">دخول</button>
            </form> 

            <p class="switch-text">
                ليس لديك حساب؟ <a href="register.html">انشئ حساب جديد</a>
            </p>
        </div>
    </main>
    <script src="../../js/auth/login.js"></script>
</body>
</html>
