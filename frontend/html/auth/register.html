<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - Mulanui Services</title>
    <!-- استدعاء ملفات الـ CSS بشكل صحيح مع مراعاة مسار المجلدات الفرعية -->
    <link rel="stylesheet" href="../../css/auth/register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- شريط التنقل العلوي -->
    <header class="navbar">
        <div class="logo" onclick="window.location.href='../../index.html'">Mulanui <span>Services</span></div>
        <nav>
            <a href="../../index.html">الرئيسية</a>
        </nav>
    </header>

    <!-- حاوية نموذج إنشاء الحساب -->
    <main class="auth-container">
        <div class="auth-card">
            <h2>إنشاء حساب جديد</h2>
            
            <!-- رسائل التنبيه (خطأ / نجاح) -->
            <div id="alert-box" class="alert"></div>
            <form id="register-form">
            <div class="form-group">
                <label for="reg-username">اسم المستخدم</label>
                <input type="text" id="reg-username" required placeholder="username123">
            </div>

            <div class="form-group">
                <label for="reg-nickname">اسم العرض (Nickname)</label>
                <input type="text" id="reg-nickname" placeholder="اسمك الذي يظهر للآخرين">
            </div>

            <div class="form-group">
                <label for="reg-email">البريد الإلكتروني</label>
                <input type="email" id="reg-email" required placeholder="name@example.com">
            </div>
            
            <div class="form-group">
                <label for="reg-password">كلمة المرور</label>
                <input type="password" id="reg-password" required placeholder="••••••••">
            </div>
            <button type="submit" id="submit-btn" class="btn-submit">تسجيل الحساب</button>
        </form>

            <p class="switch-text">
                لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
            </p>
        </div>
    </main>

    <script src="../../js/auth/register.js"></script>
</body>
</html>
